name: Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yaml
      - source
      - dub.json
      - dub.selections.json
  pull_request:
    paths:
      - .github/workflows/build.yaml
      - source
      - dub.json
      - dub.selections.json
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04

          - name: linux-aarch64
            runner: ubuntu-24.04-arm

          - name: windows-x86_64
            runner: windows-latest

          - name: macos-x86_64
            runner: macos-26-intel

          - name: macos-aarch64
            runner: macos-latest

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    env:
      DUB_HOME: ${{ github.workspace }}/.dub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Cache dub packages
        uses: actions/cache@v6
        with:
          path: .dub
          key: dub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dub.json', 'dub.selections.json') }}
          restore-keys: |
            dub-${{ runner.os }}-${{ runner.arch }}-

      - name: Install libcurl development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Cache vcpkg binaries
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/triplets/*.cmake') }}

      - name: Install libcurl development files
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl:x64-windows-static-release --overlay-triplets=.github/triplets
          "LIB=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-release\lib;$env:LIB" | Add-Content $env:GITHUB_ENV

      - name: Set release version
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "${TAG#v}" > VERSION

      - name: Build
        run: dub build --compiler=ldc2 --build=release

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: modpm-${{ matrix.name }}
          path: modpm${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 30
